# Build USAspending award-archive Parquet files and publish them to R2.
#
# Upstream regenerates every fiscal year's "Full" zip once a month (around the
# 6th-8th). `plan` asks the API for the current file name of each FY and
# compares it with the `.source` marker we uploaded last time, so most daily
# runs build nothing; once a month, every stale FY builds in parallel.
#
# Each build job: download one ~2 GB zip, convert it one CSV member at a time
# (peak disk ~7 GB, fits a stock runner), upload the Parquet, then write the
# `.source` marker last so a failed upload never marks a FY as current.
#
# Output layout in the bucket:
#   usaspending/contracts/FY2024.parquet       one per fiscal year, from the
#   usaspending/contracts/FY2024.source        monthly award archive zips
#   usaspending/assistance/FY2024.parquet      (same, financial assistance)
#   usaspending/recipients.parquet             rollups (aggregate job)
#   usaspending/recipient_year.parquet
#   usaspending/subawards.parquet              tables pulled out of the monthly
#   usaspending/sam_entities.parquet           PostgreSQL dump by range request
#   usaspending/naics.parquet ... etc          (dump job; see dump_tables.yml)
#   usaspending/dump.source

name: Build

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      fiscal_years:
        description: "Comma-separated fiscal years (default: all)"
        type: string
        default: ""
      force:
        description: "Rebuild even if upstream file is unchanged"
        type: boolean
        default: false
      aggregate:
        description: "Rebuild the rollups even if no fiscal year changed"
        type: boolean
        default: false
      dump:
        description: "Rebuild the dump tables even if the dump is unchanged"
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

env:
  R2_BUCKET: labordata-warehouse-staging
  R2_PREFIX: usaspending
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  PYTHON: python

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      dump_stale: ${{ steps.dump.outputs.stale }}
      dump_latest: ${{ steps.dump.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: dump
        run: |
          # The monthly PostgreSQL dump has no listing endpoint; probe for the
          # newest usaspending-db_YYYYMMDD.zip and compare with what we built.
          latest=$(python -c "import sys; sys.path.insert(0,'scripts'); import dump_extract as de; print(de.latest_dump())")
          current=$(aws s3 cp "s3://$R2_BUCKET/$R2_PREFIX/dump.source" - 2>/dev/null || true)
          echo "dump: latest=$latest current=$current"
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.dump }}" = "true" ] || [ "$latest" != "$current" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          matrix=$(python scripts/plan.py \
            --bucket "$R2_BUCKET" --prefix "$R2_PREFIX" --types contracts,assistance \
            ${{ inputs.fiscal_years && format('--fiscal-years {0}', inputs.fiscal_years) || '' }} \
            ${{ inputs.force && '--force' || '' }})
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "stale: $matrix"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build ${{ matrix.type }} FY${{ matrix.fy }}
        run: make ${{ matrix.type }}/FY${{ matrix.fy }}.parquet
      - name: Upload to R2
        run: |
          aws s3 cp "${{ matrix.type }}/FY${{ matrix.fy }}.parquet" \
            "s3://$R2_BUCKET/$R2_PREFIX/${{ matrix.type }}/FY${{ matrix.fy }}.parquet"
          aws s3 cp "${{ matrix.type }}/FY${{ matrix.fy }}.source" \
            "s3://$R2_BUCKET/$R2_PREFIX/${{ matrix.type }}/FY${{ matrix.fy }}.source" \
            --content-type text/plain

  dump:
    needs: plan
    if: needs.plan.outputs.dump_stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install pg_restore
        run: |
          # The dump's archive format needs a pg_restore at least as new as the
          # PostgreSQL that wrote it; Ubuntu's stock one is too old.
          sudo apt-get install -y -q postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null 2>&1
          sudo apt-get install -y -q postgresql-client-18 >/dev/null
          pg_restore --version
      - name: Build tables from ${{ needs.plan.outputs.dump_latest }}
        run: |
          # Range-fetches only the listed tables out of the ~180 GB dump; the
          # big one (subaward_search, ~4 GB gzip) is read by DuckDB straight
          # from the gzip so the runner never holds the ~26 GB text form.
          python scripts/dump_build.py --dump "${{ needs.plan.outputs.dump_latest }}" \
            --out-dir dump --memory-limit 10GB
          df -h .
      - name: Upload to R2
        run: |
          aws s3 cp dump/ "s3://$R2_BUCKET/$R2_PREFIX/" --recursive --exclude "*" --include "*.parquet"
          # Retired: the website's last-12-months cache; see dump_tables.yml.
          aws s3 rm "s3://$R2_BUCKET/$R2_PREFIX/recipient_profile.parquet" 2>/dev/null || true
          # marker last, so a failed upload never marks the dump as current
          aws s3 cp dump/SOURCE "s3://$R2_BUCKET/$R2_PREFIX/dump.source" --content-type text/plain

  aggregate:
    needs: [plan, build]
    # Run whenever something was (re)built, even if a sibling FY failed: the
    # rollup reads whatever is currently in the bucket. The `aggregate` input
    # runs it on its own, for when the rollup SQL changes but no fiscal year has.
    if: |
      always() && needs.plan.result == 'success'
      && (needs.build.result != 'skipped' || inputs.aggregate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/aggregate.py --bucket "$R2_BUCKET" --prefix "$R2_PREFIX"
      - run: |
          aws s3 cp aggregates/ "s3://$R2_BUCKET/$R2_PREFIX/" --recursive --exclude "tmp/*" --exclude "scratch.duckdb*"
          # Retired: per-recipient drill-downs are canned queries now.
          aws s3 rm "s3://$R2_BUCKET/$R2_PREFIX/recipient_year_agency.parquet" || true

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
